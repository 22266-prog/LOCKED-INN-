<title>LOCKED IN</title>

<style>
:root{--red:#d7141f;--bg:#f3f4f6;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--g:#22c55e;--empty:#e5e7eb;--l1:#bbf7d0;--l2:#86efac;--l3:#22c55e;--l4:#15803d;--tint:#fdecee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b1f26;--ink:#e8eaed;--mut:#9aa3af;--line:#2d333d;--empty:#2a3039;--tint:#3a1a1d}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b1f26;--ink:#e8eaed;--mut:#9aa3af;--line:#2d333d;--empty:#2a3039;--tint:#3a1a1d}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Prompt,system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}main,.card{min-width:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .1s}button:active{transform:scale(.95)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--ink)}.logo svg{color:var(--red)}
nav{display:flex;gap:4px;flex:1}nav button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;color:var(--mut);font-size:14px;border-bottom:2px solid transparent}
nav button.on{color:var(--red);background:var(--tint);font-weight:600}
.lang{display:flex;background:var(--bg);border-radius:10px;padding:3px}.lang button{padding:4px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut)}.lang button.on{background:var(--red);color:#fff}
main{max-width:1000px;margin:0 auto;padding:22px 16px 40px}
h1{margin:0;font-size:26px}h2{margin:0 0 12px;font-size:17px}.mut{color:var(--mut);margin:2px 0 14px}small{color:var(--mut)}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.grid .card{margin:0}
.g3{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.btn{background:var(--red);color:#fff;border-radius:10px;padding:9px 18px;font-weight:600}.btn2{background:var(--bg);border-radius:10px;padding:9px 16px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:99px;padding:6px 14px;margin:3px 3px 3px 0;font-size:14px;transition:.15s}
.pill svg{width:15px;height:15px}.pill.on{background:var(--red);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--red);border-radius:99px;padding:4px 6px 4px 12px;margin:3px;font-size:14px}.chip svg{width:14px;height:14px}
.ac{display:grid;grid-template-columns:44px 1fr 48px 46px;gap:10px 12px;align-items:center}.ai{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--red);display:grid;place-items:center}
.an{font-weight:600;min-width:0;overflow-wrap:anywhere}.rg{position:relative;width:48px;height:48px}.rg span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--mut)}
.ms{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;line-height:1.25;color:var(--mut);overflow-wrap:anywhere}.ms b{display:block;color:var(--ink);font-size:14px}
.ck{width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}.ck.on{background:var(--g)}.ck.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.35)}100%{transform:scale(1)}}
.strip{display:flex;gap:6px;margin:12px 0;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;position:relative}.strip .td{outline:2px solid var(--red);outline-offset:-2px}.strip button{flex:0 0 54px;scroll-snap-align:center;padding:8px 0;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut)}.strip b{font-size:17px;color:var(--ink)}.strip .on{background:var(--red);color:#fff}.strip .on b{color:#fff}.strip button:disabled{opacity:.35}
.st{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column}.st svg{color:var(--red);width:20px;height:20px}.st b{font-size:22px}
.seg{display:inline-flex;background:var(--card);border-radius:12px;padding:4px;margin:0 6px 12px 0;flex-wrap:wrap}.seg button{padding:6px 14px;border-radius:9px;font-size:14px}.seg .on{background:var(--red);color:#fff}
.chart{width:100%;height:auto}.chart text{font-size:11px;fill:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}.b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}.b i{width:100%;max-width:38px;border-radius:6px 6px 0 0;min-height:2px;display:block}.b em{font-style:normal}
.hero{background:var(--red);color:#fff;border-radius:18px;padding:22px;margin-bottom:14px}.hero h1{font-size:30px}
.big{font-size:30px;font-weight:700}.center{text-align:center}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;gap:2px;max-width:560px}.heat button{width:auto;height:auto;aspect-ratio:1;min-width:0;border-radius:2px;background:var(--empty)}
.l1{background:var(--l1)!important}.l2{background:var(--l2)!important}.l3{background:var(--l3)!important}.l4{background:var(--l4)!important}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal small{font-size:12px}
.cal button{aspect-ratio:1;max-height:56px;border-radius:50%;background:var(--empty);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cal .full{background:var(--g);color:#fff}.cal .part{background:#fde68a;color:#78350f}.cal .tod{outline:2px solid var(--red);outline-offset:1px}.cal .fut{opacity:.35}.cal i{font-style:normal;font-size:10px}
.leg{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mut);margin-top:6px}.leg span{width:12px;height:12px;border-radius:3px;background:var(--empty)}
.av{width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;padding:30px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#14532d;color:#fff;padding:10px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:#991b1b}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:40;padding:16px}#modal[hidden]{display:none}.mbox{background:var(--card);border-radius:18px;padding:22px;max-width:380px;width:100%}.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.lg{height:40px;width:40px;border-radius:10px;display:block}.lgb{width:96px;height:96px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:0 6px 18px rgba(215,20,31,.35)}
.load{text-align:center;padding:60px;color:var(--mut)}
.authw{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:16px}.authc{width:100%;max-width:400px;animation:rise .4s}@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.authc h1{font-size:24px;margin-bottom:2px}.f{display:block;margin-bottom:12px;font-size:14px}.f input:not([type=checkbox]){width:100%;margin-top:4px;padding:11px 12px}.pwr{position:relative}.pwr button{position:absolute;right:10px;top:50%;transform:translateY(-35%);color:var(--mut)}
.ferr,.fok{border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px}.ferr{background:#fee2e2;color:#991b1b}.fok{background:#dcfce7;color:#166534}.authc .btn{width:100%;padding:12px}.authc .lk{color:var(--red);font-weight:600}
.acct{display:flex;gap:8px;align-items:center}.who{display:flex;flex-direction:column;line-height:1.2;font-size:13px;text-align:right}.av.sm{width:34px;height:34px;font-size:15px;padding:0}
@media(max-width:720px){.who{display:none}}
.sl{display:none}.full{width:100%;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px}.danger{color:#b91c1c}.pwr button{width:44px;height:44px;top:auto;bottom:0;right:0;transform:none;display:grid;place-items:center}
@media(max-width:900px){.fl{display:none}.sl{display:inline}.who{display:none}nav button{padding:8px;font-size:13px}}
@media(max-width:720px){header{padding:8px 12px;gap:10px}.hdsp{margin-left:auto}.acct .btn2{display:none}.lang button{min-height:40px;min-width:48px}.av.sm{width:40px;height:40px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.06);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:0;z-index:9}
nav button{flex:1;flex-direction:column;justify-content:center;font-size:11px;gap:2px;padding:6px 2px;min-height:56px}nav button.on{background:none}nav svg{width:24px;height:24px}
main{padding:14px 14px calc(88px + env(safe-area-inset-bottom,0px))}h1{font-size:22px}.card{padding:14px;border-radius:16px}.hero{padding:18px}.hero h1{font-size:26px}
.g3{grid-template-columns:1fr 1fr}.st b{font-size:19px}.st small{overflow-wrap:anywhere}.dg{grid-template-columns:1fr 1fr}.dg>.card:first-child{grid-column:1/-1}
input,select{font-size:16px;min-height:44px}input[type=checkbox]{min-height:0;width:22px;height:22px;accent-color:var(--red)}input[type=date]{flex:1;min-width:0}.btn,.btn2{min-height:46px}.pill{min-height:40px;padding:8px 14px}.seg{display:flex;width:100%}.seg button{flex:1;min-height:44px}[data-a=del]{min-width:44px;min-height:44px}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding-inline:14px}.chips .pill{white-space:nowrap;flex:none}
#nn{flex:1 1 100%}.selbar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:7;box-shadow:0 -4px 14px rgba(0,0,0,.14);max-height:42vh;overflow:auto}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;box-shadow:0 6px 16px rgba(215,20,31,.4);z-index:8}.strip button{min-height:60px}.cal{gap:4px}.cal button{max-height:48px}
#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:90vw;text-align:center}#modal{place-items:end center;padding:0}.mbox{max-width:none;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .25s}.mact .btn,.mact .btn2{flex:1}
.authw{min-height:calc(100dvh - 70px);padding:8px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
